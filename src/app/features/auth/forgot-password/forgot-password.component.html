<!-- features/auth/forgot-password/forgot-password.component.html -->
<vc-auth-layout>

  <!-- Pre-sent state -->
  <ng-container *ngIf="!sent()">

    <div class="fp-header">
      <div class="fp-icon" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="4" width="20" height="16" rx="2"/>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
        </svg>
      </div>
      <h2 class="title">Recupera tu acceso</h2>
      <p class="subtitle">Te enviamos un enlace para restablecer tu contraseña.</p>
    </div>

    <form class="fp-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <vc-input
        formControlName="email"
        type="email"
        label="Correo electrónico"
        placeholder="tu@empresa.com"
        [error]="getEmailError()">
      </vc-input>

      <vc-button
        type="submit"
        label="Enviar enlace"
        variant="primary"
        size="lg"
        [fullWidth]="true"
        [loading]="isLoading()">
      </vc-button>
    </form>

    <p class="back-link">
      <a routerLink="/auth/login">← Volver a iniciar sesión</a>
    </p>

  </ng-container>

  <!-- Post-sent confirmation -->
  <ng-container *ngIf="sent()">

    <div class="fp-success">
      <div class="success-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      </div>

      <h2 class="title">Revisa tu correo</h2>
      <p class="subtitle">
        Enviamos el enlace de recuperación a<br>
        <strong>{{ sentEmail() }}</strong>
      </p>
      <p class="hint">Si no lo ves, revisa tu carpeta de spam.</p>
    </div>

    <vc-button
      label="Volver al inicio"
      variant="ghost"
      size="md"
      [fullWidth]="true"
      routerLink="/auth/login">
    </vc-button>

  </ng-container>

</vc-auth-layout>
