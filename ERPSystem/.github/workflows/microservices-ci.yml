name: microservices-ci

on:
  push:
    paths:
      - "ERPSystem/microservices/**"
      - "ERPSystem/.github/workflows/microservices-ci.yml"
  pull_request:
    paths:
      - "ERPSystem/microservices/**"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ERPSystem/microservices
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore Quantiva.SriPlatform.sln
      - run: dotnet build Quantiva.SriPlatform.sln -c Release --no-restore
      - run: dotnet test tests/Billing.Service.UnitTests/Billing.Service.UnitTests.csproj -c Release --no-build
