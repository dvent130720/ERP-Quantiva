services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway.Api/Dockerfile
    container_name: gateway
    ports: ["8080:8080"]
    environment:
      ASPNETCORE_URLS: http://+:8080
    depends_on: [identity-service, tenant-service, billing-service]

  identity-service:
    build:
      context: .
      dockerfile: src/Identity.Service/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      Jwt__Secret: ${JWT_SECRET}

  tenant-service:
    build:
      context: .
      dockerfile: src/Tenant.Service/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080

  billing-service:
    build:
      context: .
      dockerfile: src/Billing.Service/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__BillingDb: Host=postgres;Database=billing;Username=postgres;Password=postgres
      RabbitMQ__Host: rabbitmq
    depends_on: [postgres, rabbitmq]

  worker-service:
    build:
      context: .
      dockerfile: src/Worker.Service/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq
    depends_on: [rabbitmq]

  notification-service:
    build:
      context: .
      dockerfile: src/Notification.Service/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      RabbitMQ__Host: rabbitmq
    depends_on: [rabbitmq]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billing
    ports: ["5432:5432"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]

  redis:
    image: redis:7
    ports: ["6379:6379"]
