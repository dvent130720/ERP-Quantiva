<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facturación electrónica SRI</title>
  <style>
    :root { font-family: Inter, Arial, sans-serif; color-scheme: light dark; }
    body { margin:0; padding:24px; background:#081126; color:#e7ecff; }
    .wrap { max-width: 980px; margin:auto; background:#141d35; border-radius:12px; padding:22px; }
    h1,h2 { margin-top: 0; }
    .grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:12px; }
    .full { grid-column:1/-1; }
    label{ display:block; margin:8px 0 4px; font-size:.9rem; }
    input,button,textarea { width:100%; box-sizing:border-box; padding:10px; border-radius:8px; border:1px solid #2b3759; background:#0e1730; color:#fff; }
    button { cursor:pointer; border:none; font-weight:700; background:#2c6cff; }
    .card { margin-top:14px; padding:14px; border-radius:10px; background:#0f1830; }
    .result { white-space: pre-wrap; min-height: 70px; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Factura electrónica (SRI) usando backend actual</h1>
  <p>Este formulario consume los endpoints existentes: <code>/identity/token</code>, <code>/facturas</code>, <code>/facturas/{id}</code> y <code>/facturas/{clave}/estado</code>.</p>

  <div class="card">
    <h2>1) Configuración</h2>
    <div class="grid">
      <div><label>Gateway URL</label><input id="gatewayUrl" value="http://localhost:8080" /></div>
      <div><label>API Key</label><input id="apiKey" value="demo-key-tenant" /></div>
      <div><label>Tenant ID</label><input id="tenantId" /></div>
      <div><label>RUC</label><input id="ruc" /></div>
      <div><label>Usuario</label><input id="userName" value="admin@demo.com" /></div>
      <div><label>Password</label><input id="password" value="Pass.123" type="password" /></div>
      <div class="full"><button id="btnToken" type="button">Obtener token</button></div>
    </div>
  </div>

  <div class="card">
    <h2>2) Emitir factura</h2>
    <div class="grid">
      <div><label>Secuencial</label><input id="secuencial" value="1" /></div>
      <div><label>Total</label><input id="total" type="number" step="0.01" value="100.00" /></div>
      <div><label>Documento comprador</label><input id="buyerDocument" value="0912345678" /></div>
      <div><label>Nombre comprador</label><input id="buyerName" value="Consumidor Final" /></div>
      <div class="full"><button id="btnEmitir" type="button">Emitir factura</button></div>
    </div>
  </div>

  <div class="card">
    <h2>3) Consultas</h2>
    <div class="grid">
      <div><label>Invoice ID</label><input id="invoiceId" /></div>
      <div><label>Clave acceso</label><input id="claveAcceso" /></div>
      <div><button id="btnById" type="button">Consultar por ID</button></div>
      <div><button id="btnByClave" type="button">Consultar estado por clave</button></div>
    </div>
  </div>

  <div class="card">
    <h2>Resultado</h2>
    <div class="result" id="result">Listo para operar...</div>
  </div>
</div>

<script>
  const q = new URLSearchParams(window.location.search);
  const result = document.getElementById('result');
  const state = { accessToken: '' };

  document.getElementById('tenantId').value = q.get('tenantId') || '';
  document.getElementById('ruc').value = q.get('ruc') || '';

  const byId = (id) => document.getElementById(id).value.trim();
  const baseHeaders = () => ({ 'Content-Type': 'application/json', 'X-Api-Key': byId('apiKey') });
  const print = (value) => result.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);

  document.getElementById('btnToken').addEventListener('click', async () => {
    try {
      const payload = { userName: byId('userName'), password: byId('password'), tenantId: byId('tenantId') };
      const res = await fetch(`${byId('gatewayUrl')}/identity/token`, { method:'POST', headers: baseHeaders(), body: JSON.stringify(payload) });
      const json = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(json));
      state.accessToken = json.access_token || '';
      print({ message: 'Token generado', access_token: state.accessToken?.slice(0, 30) + '...' });
    } catch (e) { print(`Error token: ${e.message}`); }
  });

  document.getElementById('btnEmitir').addEventListener('click', async () => {
    try {
      const payload = {
        tenantId: byId('tenantId'),
        ruc: byId('ruc'),
        secuencial: byId('secuencial'),
        total: Number(byId('total')),
        buyerDocument: byId('buyerDocument'),
        buyerName: byId('buyerName')
      };

      const headers = { ...baseHeaders(), 'X-Tenant-Id': byId('tenantId') };
      if (state.accessToken) headers.Authorization = `Bearer ${state.accessToken}`;

      const res = await fetch(`${byId('gatewayUrl')}/facturas`, { method:'POST', headers, body: JSON.stringify(payload) });
      const json = await res.json();
      if (!res.ok) throw new Error(JSON.stringify(json));

      if (json.id) document.getElementById('invoiceId').value = json.id;
      if (json.claveAcceso) document.getElementById('claveAcceso').value = json.claveAcceso;
      print(json);
    } catch (e) { print(`Error emitir: ${e.message}`); }
  });

  document.getElementById('btnById').addEventListener('click', async () => {
    try {
      const res = await fetch(`${byId('gatewayUrl')}/facturas/${byId('invoiceId')}`, { headers: baseHeaders() });
      const txt = await res.text();
      print(`Status ${res.status}\n${txt}`);
    } catch (e) { print(`Error consulta ID: ${e.message}`); }
  });

  document.getElementById('btnByClave').addEventListener('click', async () => {
    try {
      const res = await fetch(`${byId('gatewayUrl')}/facturas/${byId('claveAcceso')}/estado`, { headers: baseHeaders() });
      const txt = await res.text();
      print(`Status ${res.status}\n${txt}`);
    } catch (e) { print(`Error consulta clave: ${e.message}`); }
  });
</script>
</body>
</html>
