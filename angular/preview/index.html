<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Venturacom Preview</title>
  <style>
    :root{color-scheme:dark;--bg:#030712;--panel:rgba(7,11,24,.62);--primary:#4facfe;--text:#f5f7fb;--muted:rgba(245,247,251,.62);--soft:rgba(245,247,251,.84)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;font-family:Inter,system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top, rgba(79,172,254,.14), transparent 34%),linear-gradient(180deg,var(--bg),#050816);color:var(--text);display:grid;place-items:center}
    .orb{position:fixed;inset:50% auto auto 50%;width:min(58vw,680px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-54%);background:radial-gradient(circle at 35% 35%, rgba(173,223,255,.95), rgba(74,144,226,.9) 32%, rgba(15,93,168,.45) 58%, rgba(2,10,34,0) 74%);box-shadow:0 0 120px rgba(79,172,254,.28);animation:float 10s ease-in-out infinite}.halo{position:fixed;inset:50% auto auto 50%;width:min(80vw,1000px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, rgba(79,172,254,.22) 0%, rgba(79,172,254,.08) 34%, transparent 64%)}
    .panel{position:relative;z-index:1;width:min(100%,460px);padding:42px;border:1px solid rgba(255,255,255,.08);border-radius:32px;background:linear-gradient(180deg, rgba(7,11,24,.68) 0%, rgba(7,11,24,.5) 100%);box-shadow:0 24px 64px rgba(0,0,0,.42);backdrop-filter:blur(24px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
    .eyebrow,.subtitle,.field,.btn,.link{animation:fadeUp .72s cubic-bezier(.22,1,.36,1) both}.eyebrow{letter-spacing:.24em;text-transform:uppercase;color:var(--muted);font-size:.76rem}.title{margin:0;max-width:16ch;font-size:clamp(2.5rem,7vw,4.6rem);line-height:.98;letter-spacing:-.06em;overflow:hidden;white-space:nowrap;animation:reveal 1.8s steps(24,end) .32s forwards, fadeUp .8s cubic-bezier(.22,1,.36,1) .32s both;width:0}.subtitle{margin:0 0 6px;max-width:30ch;color:var(--soft);line-height:1.5}.stack{width:100%;display:flex;flex-direction:column;gap:14px}.field{width:100%;padding:18px 20px;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:rgba(8,12,24,.72);color:var(--soft)}.btn{width:100%;min-height:56px;border-radius:999px;border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#b2dbff 0%, var(--primary) 100%);color:#04111f;box-shadow:0 18px 38px rgba(79,172,254,.3)}.btn.secondary{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(255,255,255,.04);color:var(--text);border-color:rgba(255,255,255,.12)}.g{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:linear-gradient(135deg,#fff 0%,#d6e9ff 100%);color:#2266d2;font-weight:700}.link{color:var(--muted);text-decoration:none}.d1{animation-delay:.38s}.d2{animation-delay:.46s}.d3{animation-delay:.54s}.d4{animation-delay:.62s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes reveal{from{width:0}to{width:100%}}@keyframes float{0%,100%{transform:translate(-50%,-54%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}
  </style>
</head>
<body>
  <div class="halo"></div>
  <div class="orb"></div>
  <section class="panel">
    <div class="eyebrow">VENTURACOM</div>
    <h1 class="title">Impulsa</h1>
    <p class="subtitle">Ingresa tu correo y despega con una experiencia fluida.</p>
    <div class="stack">
      <input class="field d1" placeholder="Email" />
      <button class="btn primary d2">Comenzar</button>
      <button class="btn secondary d3"><span class="g">G</span>Continuar con Google</button>
      <a class="link d4" href="#">Ya tengo cuenta</a>
    </div>
  </section>
</body>
</html>
